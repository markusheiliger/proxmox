name: Build Container Images

on:
  push:
    paths:
      - 'containers/**'
      - '.github/workflows/build-containers.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

jobs:
  discover-images:
    name: Discover Container Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Discover image build contracts
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t image_dirs < <(
            find containers -mindepth 2 -maxdepth 2 -name Dockerfile -printf '%h\n' |
              sort
          )
          mapfile -t version_images < <(jq --exit-status --raw-output 'keys[]' containers/image-version.json)
          mapfile -t dockerfile_images < <(printf '%s\n' "${image_dirs[@]##*/}")

          [[ ${#image_dirs[@]} -gt 0 ]] || {
            echo 'No containers/*/Dockerfile files found' >&2
            exit 1
          }

          mismatch=$(
            comm -3 \
              <(printf '%s\n' "${dockerfile_images[@]}") \
              <(printf '%s\n' "${version_images[@]}")
          )
          if [[ -n "$mismatch" ]]; then
            echo 'Dockerfile directories and image-version.json keys differ:' >&2
            printf '%s\n' "$mismatch" >&2
            exit 1
          fi

          matrix='[]'
          for image_dir in "${image_dirs[@]}"; do
            image=${image_dir##*/}
            dockerfile=$image_dir/Dockerfile
            test_script=$image_dir/tests/test-image.sh
            version=$(jq --exit-status --raw-output --arg image "$image" '.[$image]' containers/image-version.json)
            build_arg=$(
              sed -nE \
                's/^LABEL org\.opencontainers\.image\.version="\$\{([A-Z0-9_]+)\}".*/\1/p' \
                "$dockerfile"
            )

            [[ "$version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "$image has invalid stable version: $version" >&2
              exit 1
            }
            [[ -n "$build_arg" ]] || {
              echo "$dockerfile must label its version from one build argument" >&2
              exit 1
            }
            [[ -x "$test_script" ]] || {
              echo "$test_script must exist and be executable" >&2
              exit 1
            }

            entry=$(jq --null-input --compact-output \
              --arg image "$image" \
              --arg version "$version" \
              --arg build_arg "$build_arg" \
              '{image: $image, version: $version, build_arg: $build_arg}')
            matrix=$(jq --compact-output --argjson entry "$entry" '. + [$entry]' <<< "$matrix")
          done

          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  build-images:
    name: Build and Publish ${{ matrix.image }} (${{ matrix.version }})
    needs: discover-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-images.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Audit current image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
        shell: bash
        run: |
          set -euo pipefail

          {
            echo '## ${{ matrix.image }}'
            echo
            echo '### Current published image'
          } >> "$GITHUB_STEP_SUMMARY"

          if docker pull "$IMAGE" >/dev/null 2>&1; then
            digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
            version=$(docker image inspect \
              --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$IMAGE")
            {
              echo "- Digest: \`$digest\`"
              echo "- Version: \`$version\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- No previously published image.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ matrix.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ matrix.version }}
            type=semver,pattern={{major}},value=${{ matrix.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: containers/${{ matrix.image }}
          build-args: ${{ matrix.build_arg }}=${{ matrix.version }}
          load: true
          tags: local/${{ matrix.image }}:test

      - name: Test image contract
        env:
          EXPECTED_VERSION: ${{ matrix.version }}
        shell: bash
        run: containers/${{ matrix.image }}/tests/test-image.sh local/${{ matrix.image }}:test

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: containers/${{ matrix.image }}
          build-args: ${{ matrix.build_arg }}=${{ matrix.version }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Verify published image
        env:
          EXPECTED_VERSION: ${{ matrix.version }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          docker pull "$IMAGE"
          containers/${{ matrix.image }}/tests/test-image.sh "$IMAGE"

          {
            echo
            echo '### Published image'
            echo "- Version: \`${{ matrix.version }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo '- Publication status: **verified**'
          } >> "$GITHUB_STEP_SUMMARY"