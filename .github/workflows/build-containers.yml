name: Build Container Images

on:
  push:
    paths:
      - 'containers/**'
      - '.github/workflows/build-containers.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

jobs:
  caddy-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Caddy release pin
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version=$(cat containers/caddy-version)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "containers/caddy-version must contain one stable semantic version" >&2
            exit 1
          fi

          upstream=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/caddyserver/caddy/releases/latest |
            jq --raw-output '.tag_name | ltrimstr("v")')

          {
            echo '## Caddy release'
            echo
            echo "- Repository pin: \`$version\`"
            echo "- Latest upstream stable: \`$upstream\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$version" != "$upstream" ]]; then
            echo "Caddy release pin $version is stale; latest stable is $upstream" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: caddy-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        image:
          - caddy-dnsimple
          - caddy-stepca

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Audit current image
        env:
          CADDY_RELEASE: ${{ needs.caddy-release.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## ${{ matrix.image }}"
            echo
            echo '### Current published image'
          } >> "$GITHUB_STEP_SUMMARY"

          docker pull "$IMAGE"

          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          version=$(docker run --rm --entrypoint caddy "$IMAGE" version | cut -d' ' -f1)
          status=current

          [[ "$version" == "v$CADDY_RELEASE" ]] || status=stale

          {
            echo "- Digest: \`$digest\`"
            echo "- Caddy: \`$version\`"
            echo "- Version status: **$status**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.caddy-release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.caddy-release.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.caddy-release.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ needs.caddy-release.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: containers/${{ matrix.image }}
          build-args: CADDY_RELEASE=${{ needs.caddy-release.outputs.version }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Verify published image
        env:
          CADDY_RELEASE: ${{ needs.caddy-release.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          docker pull "$IMAGE"

          version=$(docker run --rm --entrypoint caddy "$IMAGE" version | cut -d' ' -f1)
          label=$(docker image inspect \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$IMAGE")

          [[ "$version" == "v$CADDY_RELEASE" ]]
          [[ "$label" == "$CADDY_RELEASE" ]]

          {
            echo
            echo '### Published image'
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Caddy: \`$version\`"
            echo "- Version label: \`$label\`"
            echo '- Version status: **verified**'
          } >> "$GITHUB_STEP_SUMMARY"
