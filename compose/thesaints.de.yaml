services:
  # Hello World service - replace with your actual application
  hello:
    container_name: hello
    restart: unless-stopped
    image: traefik/whoami:latest
    labels:
      caddy: ${HOSTNAME}
      caddy.reverse_proxy: "{{upstreams 80}}"

  # Caddy reverse proxy with automatic SSL via Let's Encrypt (DNS-01)
  caddy:
    container_name: caddy
    restart: unless-stopped
    image: ghcr.io/markusheiliger/caddy-dnsimple:latest
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/docker/caddy/data:/data
    environment:
      DNSIMPLE_API_ACCESS_TOKEN: ${DNSIMPLE_API_ACCESS_TOKEN}
    labels:
      caddy.email: ${CADDY_EMAIL}
      caddy.tls.dns: dnsimple {env.DNSIMPLE_API_ACCESS_TOKEN}

  # Newt tunnel for external access via Pangolin
  newt:
    container_name: newt
    restart: unless-stopped
    image: fosrl/newt
    environment:
      NEWT_ID: ${NEWT_ID}
      NEWT_SECRET: ${NEWT_SECRET}
      NEWT_ENDPOINT: ${NEWT_ENDPOINT}
