server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Flutter web ships .wasm assets; make sure they get the right MIME type.
    types {
        application/wasm wasm;
    }

    # CanvasKit / WASM threads need a cross-origin isolated context
    # (SharedArrayBuffer). All assets are same-origin so require-corp is safe.
    add_header Cross-Origin-Opener-Policy   "same-origin"   always;
    add_header Cross-Origin-Embedder-Policy "require-corp"  always;
    add_header Cross-Origin-Resource-Policy "same-origin"   always;

    # Never cache the runtime config or the bootstrap document.
    location = /rustdesk-config.js {
        add_header Cache-Control "no-store" always;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
